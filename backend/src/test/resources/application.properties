spring.datasource.url=jdbc:h2:mem:wikilaw;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS JSON
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.main.banner-mode=off
logging.level.root=WARN
logging.level.forge.wikilaw.backend.service.DataJudImportService=OFF
