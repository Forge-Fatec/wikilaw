spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.fail-on-unknown-properties=false

wikilaw.integration.datajud.base-url=${DATAJUD_BASE_URL:https://api-publica.datajud.cnj.jus.br}
wikilaw.integration.datajud.api-key=${DATAJUD_API_KEY:}
wikilaw.integration.datajud.connect-timeout=${DATAJUD_CONNECT_TIMEOUT:5s}
wikilaw.integration.datajud.read-timeout=${DATAJUD_READ_TIMEOUT:30s}
wikilaw.integration.datajud.max-retries=${DATAJUD_MAX_RETRIES:2}
wikilaw.integration.datajud.retry-delay=${DATAJUD_RETRY_DELAY:500ms}

wikilaw.cors.allowed-origins=${WIKILAW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Conta administrativa criada na primeira inicializacao do banco.
wikilaw.security.initial-admin.login=${WIKILAW_INITIAL_ADMIN_LOGIN:Admin}
wikilaw.security.initial-admin.password=${WIKILAW_INITIAL_ADMIN_PASSWORD:Admin 123}

wikilaw.bootstrap.jurisprudencia.enabled=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_ENABLED:true}
wikilaw.bootstrap.jurisprudencia.completo=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_COMPLETO:true}
wikilaw.bootstrap.jurisprudencia.termo=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_TERMO:dano moral}
wikilaw.bootstrap.jurisprudencia.paginas=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_PAGINAS:3}
wikilaw.bootstrap.jurisprudencia.tamanho-pagina=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_TAMANHO_PAGINA:20}
wikilaw.bootstrap.jurisprudencia.somente-se-vazio=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_SOMENTE_SE_VAZIO:false}

server.port=8080
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=8h

# One page at a time per application instance; SKIP LOCKED coordinates replicas.
wikilaw.import.worker.enabled=${WIKILAW_IMPORT_WORKER_ENABLED:true}
wikilaw.import.worker.poll-delay=${WIKILAW_IMPORT_POLL_DELAY:1000}

# Preparacao local e deterministica do acervo para a futura geracao de embeddings.
wikilaw.semantic.chunk.max-tokens=${WIKILAW_SEMANTIC_CHUNK_MAX_TOKENS:600}
wikilaw.semantic.chunk.overlap-tokens=${WIKILAW_SEMANTIC_CHUNK_OVERLAP_TOKENS:80}
wikilaw.semantic.backfill.enabled=${WIKILAW_SEMANTIC_BACKFILL_ENABLED:true}
wikilaw.semantic.backfill.batch-size=${WIKILAW_SEMANTIC_BACKFILL_BATCH_SIZE:100}
wikilaw.semantic.backfill.initial-delay=${WIKILAW_SEMANTIC_BACKFILL_INITIAL_DELAY:5000}
wikilaw.semantic.backfill.poll-delay=${WIKILAW_SEMANTIC_BACKFILL_POLL_DELAY:2000}

# Inference runs only on the server. Compose enables this with the internal embeddings service.
wikilaw.vector.enabled=${WIKILAW_VECTOR_ENABLED:false}
wikilaw.vector.service-url=${WIKILAW_EMBEDDING_URL:http://localhost:8000}
# Geracao de embeddings; desligada ate um provedor ser configurado.
# gemini: usa WIKILAW_GEMINI_API_KEY. openai-compatible: usa base-url e api-key abaixo (Voyage, Ollama, OpenAI).
wikilaw.semantic.embedding.enabled=${WIKILAW_EMBEDDING_ENABLED:false}
wikilaw.semantic.embedding.provider=${WIKILAW_EMBEDDING_PROVIDER:gemini}
wikilaw.semantic.embedding.base-url=${WIKILAW_EMBEDDING_BASE_URL:}
wikilaw.semantic.embedding.api-key=${WIKILAW_EMBEDDING_API_KEY:}
wikilaw.semantic.embedding.model=${WIKILAW_EMBEDDING_MODEL:gemini-embedding-001}
wikilaw.semantic.embedding.dimensions=${WIKILAW_EMBEDDING_DIMENSIONS:0}
wikilaw.semantic.embedding.batch-size=${WIKILAW_EMBEDDING_BATCH_SIZE:32}
wikilaw.semantic.embedding.document-prefix=${WIKILAW_EMBEDDING_DOCUMENT_PREFIX:}
wikilaw.semantic.embedding.query-prefix=${WIKILAW_EMBEDDING_QUERY_PREFIX:}
wikilaw.semantic.embedding.send-input-type=${WIKILAW_EMBEDDING_SEND_INPUT_TYPE:false}
wikilaw.semantic.embedding.connect-timeout=${WIKILAW_EMBEDDING_CONNECT_TIMEOUT:5s}
wikilaw.semantic.embedding.read-timeout=${WIKILAW_EMBEDDING_READ_TIMEOUT:60s}
wikilaw.semantic.embedding.max-retries=${WIKILAW_EMBEDDING_MAX_RETRIES:2}
wikilaw.semantic.embedding.retry-delay=${WIKILAW_EMBEDDING_RETRY_DELAY:1s}
wikilaw.semantic.embedding.worker.documents-per-batch=${WIKILAW_EMBEDDING_WORKER_DOCUMENTS_PER_BATCH:10}
wikilaw.semantic.embedding.worker.max-attempts=${WIKILAW_EMBEDDING_WORKER_MAX_ATTEMPTS:5}
wikilaw.semantic.embedding.worker.retry-backoff=${WIKILAW_EMBEDDING_WORKER_RETRY_BACKOFF:5m}
wikilaw.semantic.embedding.worker.processing-timeout=${WIKILAW_EMBEDDING_WORKER_PROCESSING_TIMEOUT:15m}
wikilaw.semantic.embedding.worker.initial-delay=${WIKILAW_EMBEDDING_WORKER_INITIAL_DELAY:10000}
wikilaw.semantic.embedding.worker.poll-delay=${WIKILAW_EMBEDDING_WORKER_POLL_DELAY:5000}

# Analise juridica assistida por IA (Google Gemini). Chave em https://aistudio.google.com/apikey
wikilaw.ai.gemini.enabled=${WIKILAW_GEMINI_ENABLED:false}
wikilaw.ai.gemini.base-url=${WIKILAW_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
wikilaw.ai.gemini.api-key=${WIKILAW_GEMINI_API_KEY:}
wikilaw.ai.gemini.model=${WIKILAW_GEMINI_MODEL:gemini-3.5-flash}
wikilaw.ai.gemini.temperature=${WIKILAW_GEMINI_TEMPERATURE:0.2}
wikilaw.ai.gemini.max-output-tokens=${WIKILAW_GEMINI_MAX_OUTPUT_TOKENS:8192}
# Teto do raciocinio do modelo, descontado do limite acima; -1 deixa o modelo decidir.
wikilaw.ai.gemini.thinking-budget=${WIKILAW_GEMINI_THINKING_BUDGET:2048}
wikilaw.ai.gemini.connect-timeout=${WIKILAW_GEMINI_CONNECT_TIMEOUT:5s}
wikilaw.ai.gemini.read-timeout=${WIKILAW_GEMINI_READ_TIMEOUT:90s}
wikilaw.ai.gemini.max-retries=${WIKILAW_GEMINI_MAX_RETRIES:1}
wikilaw.ai.gemini.retry-delay=${WIKILAW_GEMINI_RETRY_DELAY:2s}
# Contexto juridico da analise: resultados da pesquisa enviados ao modelo, em ordem de relevancia.
wikilaw.ai.contexto.max-documentos=${WIKILAW_AI_CONTEXTO_MAX_DOCUMENTOS:10}
# Orcamento de caracteres do conteudo dos documentos, dividido igualmente entre eles.
wikilaw.ai.contexto.max-caracteres=${WIKILAW_AI_CONTEXTO_MAX_CARACTERES:30000}
wikilaw.ai.contexto.max-caracteres-campo=${WIKILAW_AI_CONTEXTO_MAX_CARACTERES_CAMPO:2500}

# Recuperacao por similaridade de vetores (indice HNSW do pgvector).
wikilaw.semantic.search.ef-search=${WIKILAW_SEMANTIC_SEARCH_EF_SEARCH:100}
wikilaw.semantic.search.iterative-scan=${WIKILAW_SEMANTIC_SEARCH_ITERATIVE_SCAN:relaxed_order}
wikilaw.semantic.search.candidate-multiplier=${WIKILAW_SEMANTIC_SEARCH_CANDIDATE_MULTIPLIER:5}
wikilaw.semantic.search.max-results=${WIKILAW_SEMANTIC_SEARCH_MAX_RESULTS:50}
wikilaw.semantic.search.query.min-characters=${WIKILAW_SEMANTIC_QUERY_MIN_CHARACTERS:20}
wikilaw.semantic.search.query.max-characters=${WIKILAW_SEMANTIC_QUERY_MAX_CHARACTERS:20000}
wikilaw.semantic.search.query.cache-size=${WIKILAW_SEMANTIC_QUERY_CACHE_SIZE:200}
wikilaw.semantic.search.score.minimum=${WIKILAW_SEMANTIC_SCORE_MINIMUM:0.2}
wikilaw.semantic.search.score.maximum=${WIKILAW_SEMANTIC_SCORE_MAXIMUM:0.7}