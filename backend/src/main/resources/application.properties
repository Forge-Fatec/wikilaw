spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.deserialization.fail-on-unknown-properties=false

wikilaw.integration.datajud.base-url=${DATAJUD_BASE_URL:https://api-publica.datajud.cnj.jus.br}
wikilaw.integration.datajud.api-key=${DATAJUD_API_KEY:}
wikilaw.integration.datajud.connect-timeout=${DATAJUD_CONNECT_TIMEOUT:5s}
wikilaw.integration.datajud.read-timeout=${DATAJUD_READ_TIMEOUT:30s}
wikilaw.integration.datajud.max-retries=${DATAJUD_MAX_RETRIES:2}
wikilaw.integration.datajud.retry-delay=${DATAJUD_RETRY_DELAY:500ms}

wikilaw.cors.allowed-origins=${WIKILAW_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

wikilaw.bootstrap.jurisprudencia.enabled=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_ENABLED:false}
wikilaw.bootstrap.jurisprudencia.termo=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_TERMO:dano moral}
wikilaw.bootstrap.jurisprudencia.paginas=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_PAGINAS:3}
wikilaw.bootstrap.jurisprudencia.tamanho-pagina=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_TAMANHO_PAGINA:20}
wikilaw.bootstrap.jurisprudencia.somente-se-vazio=${WIKILAW_BOOTSTRAP_JURISPRUDENCIA_SOMENTE_SE_VAZIO:false}

server.port=8080
