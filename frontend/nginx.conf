server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 11m;

    # Administrative import routes remain reachable only on the loopback backend port.
    location /api/integrations/ { return 403; }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # nginx is the edge: send only the real client address. Appending to the header the
        # client sent would let it forge its IP and dodge the login lockout.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
