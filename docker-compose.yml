services:
  postgres:
    image: postgres:16
    container_name: wikilaw-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wikilaw
      POSTGRES_USER: wikilaw
      POSTGRES_PASSWORD: wikilaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: wikilaw-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wikilaw
      SPRING_DATASOURCE_USERNAME: wikilaw
      SPRING_DATASOURCE_PASSWORD: wikilaw
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: wikilaw-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  sonarqube-db:
    image: postgres:16
    container_name: wikilaw-sonarqube-db
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonarqube
      POSTGRES_PASSWORD: sonarqube
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data

  sonarqube:
    image: sonarqube:community
    container_name: wikilaw-sonarqube
    depends_on:
      - sonarqube-db
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonarqube
      SONAR_JDBC_PASSWORD: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent http://localhost:9000/api/system/status | grep --quiet ''"status":"UP"''',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  sonar-scanner:
    image: maven:3.9.16-eclipse-temurin-25
    entrypoint: []
    profiles:
      - analysis
    working_dir: /workspace/backend
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      MAVEN_USER_HOME: /tmp/m2
      SONAR_HOST_URL: ${SONAR_HOST_URL:-http://sonarqube:9000}
      SONAR_SCANNER_SKIP_JRE_PROVISIONING: "true"
    volumes:
      - .:/workspace
      - ./.m2-cache:/tmp/m2
    depends_on:
      sonarqube:
        condition: service_healthy
    command:
      - ./mvnw
      - -Dmaven.repo.local=/tmp/m2
      - clean
      - verify
      - sonar:sonar

volumes:
  postgres_data:
  sonarqube_db_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
