services:
  postgres:
    image: postgres:16
    container_name: wikilaw-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: wikilaw
      POSTGRES_USER: wikilaw
      POSTGRES_PASSWORD: wikilaw
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: wikilaw-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wikilaw
      SPRING_DATASOURCE_USERNAME: wikilaw
      SPRING_DATASOURCE_PASSWORD: wikilaw
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    container_name: wikilaw-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data: